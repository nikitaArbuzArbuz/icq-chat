# Полный конфиг nginx вместо стандартного из образа. В стандартном worker_connections 1024, а каждый
# WebSocket через прокси занимает два соединения (с браузером и с бэкендом): это около 500 человек на процесс.

user nginx;
worker_processes auto;
# Открытых файлов на процесс: каждое соединение — файловый дескриптор. Лимит самого контейнера
# задаётся в docker-compose.yml (ulimits): изнутри контейнера его не поднять.
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log notice;

events {
    # Соединений на процесс, считая соединения с бэкендом: до 10 000 WebSocket на каждый процесс.
    worker_connections 20000;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # В стандартном формате лога стоит $request — путь вместе со строкой запроса. WebSocket подключается
    # к /ws?token=…, и JWT попадал бы в лог. Здесь путь пишется без параметров.
    log_format main '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent $request_time "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Сжатие статики и ответов API. Шрифты woff2 уже сжаты, WebSocket это не касается.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Вход и регистрация: bcrypt тратит на запрос около 0,3 с процессора. С одного IP — 20 запросов в минуту,
    # и ещё 10 сразу на случай нескольких человек за одним адресом. Лимит на один аккаунт стоит в самом бэкенде.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
    limit_req_status 429;

    upstream backend_app {
        server backend:8080;
        # Постоянные соединения с бэкендом: без них nginx открывает новое TCP-соединение на каждый запрос /api.
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://backend_app;
            # HTTP/1.1 и пустой Connection нужны, чтобы соединения из keepalive-пула не закрывались после ответа.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Заголовки наследуются из /api/, а proxy_pass нужно повторить.
            location /api/auth/ {
                limit_req zone=auth burst=10 nodelay;
                error_page 429 = @too_many_requests;
                proxy_pass http://backend_app;
            }
        }

        # Отказ по лимиту в том же JSON, что и остальные ошибки API: клиент покажет текст из message.
        location @too_many_requests {
            default_type application/json;
            add_header Retry-After 5 always;
            return 429 '{"code":"TOO_MANY_REQUESTS","message":"Слишком много запросов с вашего адреса, подождите несколько секунд"}';
        }

        location /ws {
            proxy_pass http://backend_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        # Файлы сборки с хешем в имени: по одному адресу содержимое не меняется, поэтому кешируются на год.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # index.html браузер сверяет с сервером при каждой загрузке, иначе после обновления он открыл бы
        # старую страницу со ссылками на файлы сборки, которых уже нет.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
}
